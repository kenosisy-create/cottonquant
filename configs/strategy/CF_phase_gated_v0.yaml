strategy_id: CF_phase_gated
version: v0
strategy_type: phase_gated
status: frozen
product: CF
signal_object: CF.C1
signal_horizon: 20
signal_windows:
  momentum_days: 20
  volatility_returns: 20
entry_rule: "复用CF_tsmom_v0目标仓位并施加趋势、carry和期权门控"
exit_rule: "S4或方向冲突归零；S3只减不加；其余变更于下一交易日结算执行"
base_strategy: CF_tsmom/v0
gate_rules:
  - name: phase
    source: trend_phase_v2_daily
    parameters:
      S0: 0.0
      S1: 0.5
      S2: 1.0
      S3: 0.5
      S4: 0.0
      s3_no_add: true
      conflict_multiplier: 0.0
      missing_multiplier: 0.0
  - name: carry_tilt
    source: signal_matrix_daily.carry_signal
    parameters:
      agree: 1.0
      disagree: 0.75
      missing: 1.0
  - name: option_veto
    source: signal_matrix_daily.option_signal_direction
    parameters:
      divergence_multiplier: 0.5
      volatility_risk_multiplier: 0.5
      missing_or_not_connected: 1.0
sizing:
  model: vol_target
  capital_base: 1000000
  target_vol: 0.12
  vol_window: 20
  vol_floor: 0.05
  max_lots: 20
  multiplier_source: product_config
execution:
  timing: T_PLUS_1_SETTLE
  price_field: settle
costs:
  no_cost:
    one_way_bps: 0
  normal_cost:
    one_way_bps: 5
  conservative_cost:
    one_way_bps: 10
data_dependencies:
  - data/strategy/CF/inputs/*_continuous_price_daily.parquet
  - data/strategy/CF/inputs/*_trade_mapping_daily.parquet
  - data/research/CF/signal_matrix/*_signal_matrix_daily.parquet
  - data/research/CF/trend_phase_v2/*_trend_phase_v2_daily.parquet
  - data/core/CF/core_quote_daily.parquet
forbidden_inputs: [forward_return, fwd_ret, future_]
created_at: 2026-07-28
promotion_rule:
  required_year_wins: 4
  evaluation_years: [2021, 2022, 2023, 2024, 2025]
  min_active_days: 60
  min_completed_trades: 4
  min_full_period_delta_sharpe: 0.10
  require_positive_conservative_return: true
  max_drawdown_deterioration_pp: 5.0
changelog:
  - version: v0
    date: 2026-07-28
    note: "V5.1初始候选；所有门控参数在历史比较前固定"
  - version: v0
    date: 2026-07-28
    note: "R89固定检验结论FROZEN：3个合格年度、2个年度胜出、conservative cost后净收益为负；禁止当场调参"
