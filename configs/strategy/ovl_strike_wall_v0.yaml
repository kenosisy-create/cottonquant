strategy_id: ovl_strike_wall
version: v0
strategy_type: overlay
status: frozen
product: CF
signal_object: CF.C1
signal_horizon: 20
signal_windows:
  momentum_days: 20
  volatility_returns: 20
entry_rule: "复用CF_tsmom_v0；主力结算价距同侧OI墙小于1%时仅将新建仓目标乘0.5"
exit_rule: "存量同向仓位与减仓不受OI墙限制；目标变更于下一交易日结算执行"
base_strategy: CF_tsmom/v0
gate_rules:
  - name: strike_wall
    source: option_strike_position_daily.main_contract_same_side_wall
    parameters:
      distance_threshold: 0.01
      new_entry_multiplier: 0.5
      missing: 1.0
sizing:
  model: vol_target
  capital_base: 1000000
  target_vol: 0.12
  vol_window: 20
  vol_floor: 0.05
  max_lots: 20
  multiplier_source: product_config
execution:
  timing: T_PLUS_1_SETTLE
  price_field: settle
costs:
  no_cost:
    one_way_bps: 0
  normal_cost:
    one_way_bps: 5
  conservative_cost:
    one_way_bps: 10
data_dependencies:
  - data/strategy/CF/inputs/*_continuous_price_daily.parquet
  - data/strategy/CF/inputs/*_trade_mapping_daily.parquet
  - data/research/CF/option_strike_position/*_option_strike_position_daily.parquet
  - data/core/CF/core_quote_daily.parquet
forbidden_inputs: [forward_return, fwd_ret, future_]
created_at: 2026-07-28
promotion_rule:
  required_year_wins: 4
  evaluation_years: [2021, 2022, 2023, 2024, 2025]
  min_active_days: 60
  min_completed_trades: 4
  min_full_period_delta_sharpe: 0.10
  require_positive_conservative_return: true
  max_drawdown_deterioration_pp: 5.0
changelog:
  - version: v0
    date: 2026-07-28
    note: "R92预登记主力同侧OI墙单规则overlay；1%与0.5参数在检验前固定"
